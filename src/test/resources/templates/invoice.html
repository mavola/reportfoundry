<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Invoice</title>

    <style>
        @page {
            size: A4;
            margin: 40px;
        }

        body {
            font-family: sans-serif;
            font-size: 12px;
            color: #333333;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .invoice-number {
            color: #666666;
            margin-bottom: 30px;
        }

        .customer {
            background-color: #f5f5f5;
            padding: 12px;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #2d3748;
            color: white;
            padding: 8px;
            text-align: left;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #dddddd;
        }

        .quantity {
            text-align: center;
        }

        .price {
            text-align: right;
        }
    </style>
</head>

<body>

<h1>Invoice</h1>

<div class="invoice-number">
    Invoice #<span th:text="${invoice.number}">0000</span>
</div>

<div class="customer">
    <strong>Customer:</strong>
    <span th:text="${invoice.customer.name}">Customer Name</span>
    <br/>
    <span th:text="${invoice.customer.email}">customer@email.com</span>
</div>

<table>
    <thead>
    <tr>
        <th>Product</th>
        <th class="quantity">Quantity</th>
        <th class="price">Price</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="item : ${items}">
        <td th:text="${item.name}">Product</td>
        <td class="quantity" th:text="${item.quantity}">1</td>
        <td class="price" th:text="${item.price}">0.00</td>
    </tr>
    </tbody>
</table>

</body>
</html>
